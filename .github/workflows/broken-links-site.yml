# Link checking, in two passes.
#
#   internal  runs after every successful deploy and FAILS on a broken local link --
#             those are our bugs and always worth stopping for.
#   external  runs weekly and never fails the build. The content pages are full of
#             links to funding calls, doctoral programmes and journals that rot on
#             someone else's schedule; that is a notification, not a broken build.
name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  internal:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Check local links 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: --offline --remap '_site(/?.*)/assets/(.*) _site/assets/$2' --verbose --no-progress '_site/**/*.html'

  external:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Check outbound links 🌍
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: false # informational: external rot is not our build breaking
          args: --verbose --no-progress --max-concurrency 4 --accept 200,206,429 'https://epfl-mades.github.io/**'
