name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.rb"
      - "**.scss"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/broken-links-site.yml"
      - "!.github/workflows/image-size.yml"
      - "!.github/workflows/prettier.yml"
      - "!.github/workflows/upgrade-check.yml"
      - "!CONTRIBUTING.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.rb"
      - "**.scss"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/broken-links-site.yml"
      - "!.github/workflows/image-size.yml"
      - "!.github/workflows/prettier.yml"
      - "!.github/workflows/upgrade-check.yml"
      - "!CONTRIBUTING.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      # imagemagick generates the responsive WebP variants via jekyll-imagemagick.
      # Without it every <picture> srcset points at files that were never created.
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # The pre-v1 bin/deploy did `touch .nojekyll` and the live gh-pages branch has one.
      # github-pages-deploy-action does not create it, and Jekyll will not copy a root
      # dotfile into _site, so it has to be added here or GitHub Pages re-processes the
      # built site. This fails silently -- the deploy succeeds and the site degrades.
      - name: Add .nojekyll 🚫
        run: touch _site/.nojekyll

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
