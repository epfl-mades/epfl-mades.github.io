  description: Manura graduated from University of Moratuwa, Sri Lanka with a B.Sc. in civil engineering and a M.Sc. (Research). He got his Ph.D. from Carleton University in Ottawa, Canada with the thesis multi-scale modelling of hydrogen diffusion in solids. He worked for the laboratory for multiscale mechanics modeling in EPFL and laboratory for advanced material processing in EMPA as a postdoctoral researcher. His work at MADES is focused on ductility and strength of high entropy alloys.
